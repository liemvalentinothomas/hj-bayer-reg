#bidan-wire{--paper:light-dark(#ffffff,#23212a);--ink:light-dark(#292338,#f2ecf5);--soft:light-dark(#f7f5f9,#2c2934);--line:light-dark(#e8e3ed,#45404e);--brand:#EB318D;--onbrand:#271020;--tint:light-dark(#fff0f7,#402336);--sub:light-dark(#756d80,#bbb0c4);font:14px/1.6 'Inter',system-ui,sans-serif}

#bidan-wire header{background:var(--paper);padding:20px 26px;align-items:center}

#bidan-wire .adminbadge{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:30px}
#bidan-wire .layout{grid-template-columns:205px minmax(0,1fr)}
#bidan-wire nav{background:var(--paper);padding:24px 12px;border-right:1px solid var(--line);gap:5px}

#bidan-wire nav button{display:flex;align-items:center;gap:10px;color:var(--sub);font-weight:400}
#bidan-wire nav button.selected{background:var(--tint);color:var(--brand);font-weight:500}

#bidan-wire .box{background:var(--paper);border-radius:12px;border-color:var(--line);padding:20px;margin:16px 0}

#bidan-wire footer{font-size:11px;color:var(--sub);border-top:1px solid var(--line);background:var(--paper)}

const msg=t=>view.querySelector('#feedback').textContent=t;
const key=t=>t.trim().replace(/\s+/g,' ').toLocaleLowerCase();
if(a==='pdadd'){const name=view.querySelector('#newpd').value.trim();if(!name)return msg('Isi nama PD terlebih dahulu.'),true;if(orgs.some(p=>key(p.name)===key(name)))return msg('Nama PD sudah ada.'),true;const added={id:'pd-'+Date.now(),name,pcs:[]};orgs.push(added);orgSelected=added.id}
if(a==='pdrename'){const name=view.querySelector('#pdname').value.trim();if(!name||orgs.some(p=>p.id!==pd.id&&key(p.name)===key(name)))return msg('Nama PD kosong atau sudah digunakan.'),true;pd.name=name}
if(a==='pcsadd'){const list=view.querySelector('#newpcs').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!list.length)return msg('Isi minimal satu nama PC.'),true;for(const name of list){if(!pd.pcs.some(p=>key(p.name)===key(name)))pd.pcs.push({id:'pc-'+Date.now()+'-'+pd.pcs.length,name})}}
if(a==='pcsrename'){const inputs=Array.from(view.querySelectorAll('[data-pcname]'));const values=inputs.map(el=>el.value.trim());if(values.some(v=>!v)||new Set(values.map(key)).size!==values.length)return msg('Nama PC kosong atau duplikat dalam PD yang sama.'),true;inputs.forEach((el,i)=>{pd.pcs.find(p=>p.id===el.dataset.pcname).name=values[i]})}
orgNotice='Daftar tersimpan; dropdown peserta sudah mengikuti perubahan.';persist();render();msg(orgNotice);return true;
}
if(b.dataset.qselect!==undefined){selected=Number(b.dataset.qselect);render();return true}
if(b.dataset.qup!==undefined||b.dataset.qdown!==undefined){const i=Number(b.dataset.qup??b.dataset.qdown),j=i+(b.dataset.qup!==undefined?-1:1);if(j>=0&&j<draft().length){const f=draft();[f[i],f[j]]=[f[j],f[i]];selected=j;editorStatus='Draf diubah • belum diterbitkan';render();persist()}return true}
if(a==='addq'){draft().push({id:'custom'+Date.now(),label:'Pertanyaan baru',type:'Jawaban singkat',section:'Tambahan',required:false,help:'',options:['Pilihan 1'],condition:'',conditionValue:''});selected=draft().length-1;render();return true}
if(a==='duplicateq'){draft().splice(selected+1,0,{...structuredClone(draft()[selected]),id:'custom'+Date.now(),label:draft()[selected].label+' (salinan)'});selected++;render();return true}
if(a==='deleteq'){draft().splice(selected,1);selected=Math.max(0,selected-1);render();return true}
if(a==='draftsave'||a==='publish'){editorStatus=a==='draftsave'?'Draf tersimpan pada contoh ini':'Simulasi: revisi form diterbitkan';persist();render();return true}
if(a==='preview'){page='preview';answers={};render();return true}
if(a==='another'){another=true;answers={};page='form';render();return true}
if(a==='reopen'){another=false;page='acara';render();return true}
if(a==='review'){const missing=draft().filter(q=>isVisible(q)&&q.required&&!String(q.id==='pd'&&answers.pd==='__manual__'?answers.pd_manual:q.id==='pc'&&(answers.pd==='__manual__'||answers.pc==='__manual__')?answers.pc_manual:answers[q.id]||'').trim());if(missing.length){view.querySelector('#feedback').textContent='Lengkapi: '+missing.map(q=>q.label).join(', ');return true}page='konfirmasi';render();return true}
return false;
}

let companyLogo=defaultHJ,companyDraft=defaultHJ,assetMessage='',settingsTab='visual';
const visualDefaults=()=>({color:'#EB318D',banner:'',bannerName:'',bannerMode:'sample',positionX:50,positionY:50,eventLogo:'',eventLogoName:''});
let visuals={},visualDrafts={};
function visualConfig(){return visuals[event]||(visuals[event]=visualDefaults())}
function visualDraft(){return visualDrafts[event]||(visualDrafts[event]={...visualConfig()})}
function headerLogo(config){return config.eventLogo?'<img class="event-logo" src="'+esc(config.eventLogo)+'" alt="Logo acara">':'<span class="brandmark">PIT</span>'}
function bannerMarkup(config){if(config.bannerMode==='none')return '';if(config.bannerMode==='upload'&&config.banner)return '<img class="banner-image" src="'+esc(config.banner)+'" alt="Banner '+esc(names[event])+'" style="object-position:'+Number(config.positionX)+'% '+Number(config.positionY)+'%">';return '<div class="eventhero" role="img" aria-label="Sampul sementara acara"><div class="herotext"><strong>PIT<br>2026.</strong><p>PERTEMUAN ILMIAH TAHUNAN<br>BIDAN</p></div></div>'}
function mobilePreview(){
const config=visualDraft();
return '<div class="mobilepreview" style="--brand:'+config.color+'"><div class="previewheader">'+headerLogo(config)+'<img class="hj-logo" src="'+esc(companyDraft)+'" alt="Hexpharm Jaya — A Kalbe Company"></div><div class="previewbody">'+bannerMarkup(config)+'<p class="eyebrow">Pendaftaran gratis</p><h3>'+esc(names[event])+'</h3><p class="muted">Tanggal dan lokasi akan diumumkan</p><div class="previewcta">Daftar sekarang →</div></div></div>';
}
function visualSettings(){
const config=visualDraft();
return '<div class="banner-settings"><section><div class="uploadarea"><h3>Logo Hexpharm Jaya</h3><img src="'+esc(companyDraft)+'" alt="Logo Hexpharm Jaya"><label>Ganti logo perusahaan<input type="file" data-asset="company" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label><p class="assetnote">Logo bersama untuk semua acara. Proporsi logo dipertahankan.</p></div><div class="uploadarea"><h3>Logo acara</h3>'+(config.eventLogo?'<img src="'+esc(config.eventLogo)+'" alt="Logo acara">':'<span class="brandmark">PIT</span>')+'<label>Unggah logo acara<input type="file" data-asset="event" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label><button data-action="removeeventlogo">Hapus logo acara</button></div><div class="uploadarea"><h3>Banner utama</h3><label>Unggah / ganti banner<input type="file" data-asset="banner" accept="image/png,image/jpeg,image/webp"></label><p class="assetnote">'+esc(config.bannerName||'Sampul sementara; belum ada banner yang diunggah.')+'</p><p class="assetnote">PNG, JPG atau WebP, maksimal 8 MB. Saran ukuran 1600 × 1000 px; area potong menyesuaikan layar.</p><div class="row"><button data-action="removebanner">Hapus banner</button><button data-action="samplebanner">Gunakan sampul sementara</button></div><label>Posisi horizontal<input type="range" min="0" max="100" value="'+config.positionX+'" data-visual="positionX" '+(config.bannerMode==='upload'?'':'disabled')+'></label><label>Posisi vertikal<input type="range" min="0" max="100" value="'+config.positionY+'" data-visual="positionY" '+(config.bannerMode==='upload'?'':'disabled')+'></label></div><label>Warna utama<input type="color" value="'+config.color+'" data-visual="color"></label><p id="assetfeedback" role="status">'+esc(assetMessage)+'</p><button class="primary" data-action="savevisual">Simpan tampilan</button></section><section><h3>Pratinjau HP</h3><div id="mobile-preview">'+mobilePreview()+'</div><p class="assetnote">Perubahan draf baru diterapkan ke halaman peserta setelah disimpan.</p></section></div>';
}
function refreshPreview(){const target=view.querySelector('#mobile-preview');if(target)target.innerHTML=mobilePreview()}
root.addEventListener('input',e=>{
if(e.target.dataset.visual){const key=e.target.dataset.visual;visualDraft()[key]=key==='color'?e.target.value:Number(e.target.value);refreshPreview()}
});
root.addEventListener('change',async e=>{
const kind=e.target.dataset.asset;if(!kind)return;const file=e.target.files?.[0];if(!file)return;
const feedback=view.querySelector('#assetfeedback');
const allowed=kind==='banner'?['image/png','image/jpeg','image/webp']:['image/png','image/jpeg','image/webp','image/svg+xml'];
if(!allowed.includes(file.type)||file.size>(kind==='banner'?8:2)*1024*1024){if(feedback)feedback.textContent='Gunakan format gambar yang didukung; batas logo 2 MB dan banner 8 MB.';return}
const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const config=visualDraft();if(kind==='company')companyDraft=url;if(kind==='event'){config.eventLogo=url;config.eventLogoName=file.name}if(kind==='banner'){config.banner=url;config.bannerName=file.name;config.bannerMode='upload'}assetMessage='Gambar siap pada draf. Periksa pratinjau lalu simpan tampilan.';render()};img.onerror=()=>{URL.revokeObjectURL(url);if(feedback)feedback.textContent='Gambar tidak dapat dibuka. Pilih file lain.'};img.src=url;
});
function visualAction(b,a){
if(b.dataset.settingstab){settingsTab=b.dataset.settingstab;render();return true}
if(['removebanner','samplebanner','removeeventlogo','savevisual'].includes(a)){
const config=visualDraft();
if(a==='removebanner'){config.bannerMode='none';config.banner='';config.bannerName='';assetMessage='Banner dihapus pada draf.'}
if(a==='samplebanner'){config.bannerMode='sample';config.banner='';config.bannerName='';assetMessage='Sampul sementara dipilih.'}
if(a==='removeeventlogo'){config.eventLogo='';config.eventLogoName='';assetMessage='Logo acara kembali ke identitas sementara.'}
if(a==='savevisual'){visuals[event]={...config};companyLogo=companyDraft;assetMessage='Tampilan disimpan untuk acara ini. Logo perusahaan berlaku untuk semua acara.';persist()}
render();return true;
}
return false;
}

function render(){
root.dataset.surface=mode;
root.style.setProperty('--brand',visualConfig().color);
if(mode==='peserta'&&['acara','form','konfirmasi'].includes(page)&&receipts[event]&&!another)page='bukti';
root.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode));
root.querySelector('#brand').innerHTML=mode==='admin'?'<span class="brandmark">R</span> Ruang Registrasi':headerLogo(visualConfig())+'<span>Pertemuan<br>Bidan 2026</span>';
root.querySelector('#partner').innerHTML='<img class="hj-logo" src="'+esc(companyLogo)+'" alt="Hexpharm Jaya — A Kalbe Company">';
root.querySelector('#reviewnav').innerHTML=mode==='peserta'?'<button data-page="acara">Halaman acara</button><button data-page="form">Form</button><button data-page="konfirmasi">Konfirmasi</button><button data-page="bukti">Bukti registrasi</button>':'';
const links=mode==='peserta'?[['acara','Halaman acara'],['form','Form registrasi'],['konfirmasi','Konfirmasi data'],['bukti','Bukti registrasi']]:[['login','Login admin'],['events','Daftar acara'],['ringkasan','Ringkasan'],['peserta','Manajemen data'],['detail','Detail peserta'],['settings','Pengaturan acara'],['formsettings','Editor form'],['organisasi','Data organisasi']];
const navIcons={login:'lock-keyhole',events:'calendar-days',ringkasan:'layout-dashboard',peserta:'users',detail:'contact',settings:'settings-2',formsettings:'list-plus',organisasi:'network'};
nav.innerHTML=links.map(([key,label])=>`<button data-page="${key}" class="${page===key?'selected':''}">${mode==='admin'?`<i data-lucide="${navIcons[key]||'circle'}" aria-hidden="true"></i>`:''}${label}</button>`).join('');
root.querySelector('#caption').textContent=mode==='peserta'?'PIT Bidan 2026 · Registrasi peserta':'Ruang Registrasi · Admin utama · Data contoh';
let h='';
if(page==='acara')h=`<div class="phone">${bannerMarkup(visualConfig())}<p class="eyebrow">Pendaftaran peserta · Gratis</p><h2 class="eventtitle">${names[event]}</h2><p class="muted">Lengkapi pendaftaran Anda untuk mengikuti pertemuan ilmiah tahun ini.</p><div class="eventmeta"><span><i data-lucide="calendar-days" aria-hidden="true"></i> Tanggal akan diumumkan</span><span><i data-lucide="map-pin" aria-hidden="true"></i> Lokasi akan diumumkan</span></div><button class="primary" data-go="form">Daftar sekarang →</button></div>`;

if(page==='form'){
h=`<div class="phone"><h2>Pendaftaran peserta</h2><p>${names[event]}</p>${formFields()}<div class="actions"><button data-go="acara">← Kembali</button><button class="primary" data-action="review">Periksa jawaban →</button></div><div id="feedback" role="alert"></div></div>`;
}
if(page==='konfirmasi')h=`<div class="phone"><h2>Periksa data Anda</h2><p>Pastikan seluruh jawaban benar sebelum dikirim.</p><div class="box">${draft().filter(q=>isVisible(q)).map(q=>`<p><span class="muted">${esc(q.label)}</span><br>${esc(answerLabel(q))}</p>`).join('')}<button data-go="form">Kembali ke form</button></div><label><input id="agree" type="checkbox"> Saya telah memeriksa data dan memahami bahwa data tidak dapat diubah setelah dikirim.</label><button class="primary" data-action="submit">Kirim pendaftaran</button><div id="feedback" role="alert"></div></div>`;
if(page==='bukti'){
const receipt=receipts[event]||{name:'Siti Rahma, A.Md.Keb.',number:'PIT-2026-0001',phone:'081234567801'};
h=`<div class="phone"><div class="receipt-head"><div class="ticketicon"><i data-lucide="check" aria-hidden="true"></i></div><p class="eyebrow">Pendaftaran berhasil</p><h2>Terima kasih,<br>${esc(receipt.name)}</h2><p>Data pendaftaran Anda telah tersimpan.</p></div><div class="box"><span class="muted">Nomor registrasi</span><h2>${esc(receipt.number)}</h2><p>${names[event]}<br>[Tanggal] · [Lokasi]</p>${esc(receipt.name)}<br>${esc(receipt.phone)}</div><button data-action="save">Simpan bukti</button><p id="saved" class="muted">Bukti ini ditampilkan kembali saat Anda membuka acara yang sama.</p><button data-action="another">Daftarkan peserta lain</button><p><button data-action="reopen">Simulasikan buka ulang acara</button></p></div>`;
}
if(page==='login')h=`<div class="phone"><h2>Masuk sebagai admin</h2><p>Pengelolaan acara dan data peserta.</p>${field('Email admin','','email')}${field('Kata sandi','','password')}<button class="primary" data-go="events">Masuk — simulasi</button></div>`;
if(page==='events')h=`<h2>Daftar acara</h2><p>Kelola pendaftaran setiap acara secara terpisah.</p><button data-action="new">+ Buat acara</button>${Object.entries(names).map(([id,name])=>`<div class="box"><span class="tag">${id==='pit'?'Registrasi dibuka':'Draf'}</span><h3>${name}</h3><p>${id==='pit'?'3 peserta contoh':'0 peserta'}</p><div class="row"><button class="primary" data-event="${id}">Kelola acara</button><button data-copy="${id}">Salin pengaturan</button></div></div>`).join('')}<div id="feedback"></div>`;
const eventPicker=()=>select('Acara aktif',Object.values(names),'eventpicker');
if(page==='ringkasan')h=`${eventPicker()}<h2>Ringkasan acara</h2><div class="grid"><div class="box">Peserta terdaftar<h2>${event==='pit'?3:0}</h2></div><div class="box">Status registrasi<h2>${event==='pit'?'Dibuka':'Draf'}</h2></div></div><h3>Pemetaan peserta contoh</h3><div class="box">Pengurus IBI: 2 · Bukan pengurus: 1<hr>Bidan Delima: 1 · Tidak: 1 · Dalam proses: 1<hr>PC Contoh A: 2 · PC Contoh B: 1</div><button data-go="peserta">Lihat data peserta →</button>`;
if(page==='peserta')h=`${eventPicker()}<h2>Manajemen data peserta</h2><p>Peserta terdaftar: <span id="count">${event==='pit'?3:0}</span> · Satu baris per pendaftaran</p><div class="row"><input id="search" aria-label="Cari peserta" placeholder="Cari nama / nomor HP"><select id="filter" aria-label="Filter pengurus"><option>Semua pengurus</option><option>Pengurus IBI</option><option>Bukan pengurus</option></select></div><div class="row" style="margin-top:12px"><button data-action="csv">Unduh CSV — seluruh acara</button><button data-action="filteredcsv">Unduh CSV — hasil filter</button></div><div class="scroll"><table><thead><tr><th>Registrasi / Nama</th><th>Organisasi</th><th>Pengurus</th><th>Bidan Delima</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div><p class="muted">Filter tambahan pada versi lengkap: PD, PC, ranting, dan status Bidan Delima.</p><div class="note">Pemeriksaan kualitas: nomor HP diseragamkan, spasi dirapikan, dugaan duplikasi ditandai untuk ditinjau.</div>`;
if(page==='detail')h=`<h2>Detail peserta · PIT-001</h2><p>${names.pit}</p><div class="note">Status data: lengkap · Tidak ada dugaan duplikasi pada contoh ini</div><h3>Identitas dan organisasi</h3><div class="grid">${field('Nama lengkap','Siti Rahma, A.Md.Keb.')}${field('Nomor HP','081234567801')}${field('PD','PD Contoh')}${field('PC','PC Contoh A')}${field('Ranting','Ranting Contoh')}${field('Jabatan','PC — Sekretaris')}${field('Tempat praktik','TPMB Contoh')}${select('Bidan Delima',['Ya','Tidak','Sedang dalam proses'])}</div><label>Alasan koreksi<textarea placeholder="Catatan perubahan oleh admin"></textarea></label><button class="primary" data-action="correction">Simpan koreksi — simulasi</button><div id="feedback"></div><h3>Riwayat perubahan</h3><p class="muted">Belum ada koreksi pada data contoh.</p>`;
if(page==='settings')h=`${eventPicker()}<h2>Pengaturan acara</h2><div class="settings-tabs"><button data-settingstab="visual" class="${settingsTab==='visual'?'active':''}">Logo, banner & warna</button><button data-settingstab="general" class="${settingsTab==='general'?'active':''}">Informasi & registrasi</button></div>${settingsTab==='visual'?visualSettings():`<div class="box"><div class="grid">${field('Nama acara',names[event])}${field('Lokasi','[Lokasi acara]')}${field('Mulai registrasi','','datetime-local')}${field('Tutup registrasi','','datetime-local')}${field('Kuota peserta','1000','number')}${select('Status',['Draf','Dibuka','Ditutup'])}</div><button class="primary" data-action="settingssave">Simpan pengaturan — simulasi</button><div id="feedback"></div></div>`}`;

if(page==='formsettings')h=`${eventPicker()}<h2>Editor form</h2><p>Sesuaikan pertanyaan dan aturan untuk acara ini.</p><div class="row"><button data-action="addq">+ Pertanyaan</button><button data-action="preview">Pratinjau</button><button data-action="draftsave">Simpan draf</button><button class="primary" data-action="publish">Terbitkan perubahan</button></div><p class="muted" id="editorstatus">${editorStatus}</p><div class="grid"><section><h3>Daftar pertanyaan</h3>${draft().map((q,i)=>`<div class="question"><button data-qselect="${i}" class="${i===selected?'selected':''}">${esc(q.label)}</button><button data-qup="${i}" aria-label="Naikkan pertanyaan">↑</button><button data-qdown="${i}" aria-label="Turunkan pertanyaan">↓</button></div>`).join('')}</section><section class="box"><h3>Pengaturan pertanyaan</h3><div id="qeditor"></div></section></div><div id="feedback" role="status"></div>`;
if(page==='preview')h=`<div class="phone"><button data-go="formsettings">← Kembali ke editor</button><h2>Pratinjau draf</h2><p>${names[event]}</p>${draft().map(q=>previewField(q)).join('')}<p class="muted">Pratinjau mengikuti perubahan editor. Tidak mengirim pendaftaran.</p></div>`;


if(page==='organisasi'){
h=`<h2>Data organisasi</h2><p>Tambahkan baris, ubah nama langsung di tabel, atau hapus dari daftar pilihan.</p>
<h3>Daftar PD / Provinsi</h3><div class="scroll"><table><thead><tr><th>PD / Provinsi</th><th>Jumlah PC</th><th>Aksi</th></tr></thead><tbody>${orgs.map(pd=>`<tr><td><input aria-label="Nama ${esc(pd.name)}" data-pdedit="${esc(pd.id)}" value="${esc(pd.name)}" style="width:100%;min-width:140px"></td><td>${pd.pcs.length}</td><td><button data-pddelete="${esc(pd.id)}" ${pd.pcs.length?'disabled':''}>Hapus</button></td></tr>`).join('')||'<tr><td colspan="3">Belum ada PD.</td></tr>'}<tr><td><input id="newpd" aria-label="Nama PD baru" placeholder="Nama PD baru" style="width:100%;min-width:140px"></td><td>—</td><td><button data-action="pdadd">+ Tambah</button></td></tr></tbody></table></div><p class="muted">Untuk menghapus PD, hapus dahulu PC di bawahnya.</p>
<h3>Daftar PC</h3><div class="scroll"><table><thead><tr><th>PD / Provinsi</th><th>PC / Kabupaten / Kota</th><th>Aksi</th></tr></thead><tbody>${orgs.flatMap(pd=>pd.pcs.map(pc=>`<tr><td>${esc(pd.name)}</td><td><input aria-label="Nama ${esc(pc.name)}" data-pcedit="${esc(pc.id)}" data-parent="${esc(pd.id)}" value="${esc(pc.name)}" style="width:100%;min-width:140px"></td><td><button data-pcdelete="${esc(pc.id)}" data-parent="${esc(pd.id)}">Hapus</button></td></tr>`)).join('')||'<tr><td colspan="3">Belum ada PC.</td></tr>'}
<tr><td><select id="newpcparent" aria-label="PD untuk PC baru"><option value="">Pilih PD</option>${orgs.map(pd=>`<option value="${esc(pd.id)}">${esc(pd.name)}</option>`).join('')}</select></td><td><input id="newpcname" aria-label="Nama PC baru" placeholder="Nama PC baru" style="width:100%;min-width:140px"></td><td><button data-action="tablepcadd" ${orgs.length?'':'disabled'}>+ Tambah</button></td></tr></tbody></table></div>
<p id="feedback" role="status">${orgNotice}</p><p class="muted">Tersimpan otomatis pada contoh ini. Dropdown PC peserta mengikuti PD yang dipilih; ranting tetap isian teks.</p><button data-action="preview">Pratinjau form peserta →</button>`;
}
view.innerHTML=h;
const picker=view.querySelector('#eventpicker');if(picker){picker.value=names[event];picker.onchange=()=>{event=Object.keys(names).find(k=>names[k]===picker.value);render()}}
if(page==='peserta'){updateRows();view.querySelector('#search').oninput=updateRows;view.querySelector('#filter').onchange=updateRows}
if(page==='formsettings'){selected=Math.min(selected,draft().length-1);renderEditor();}
if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
}
function visibleRows(){if(event!=='pit')return [];const query=(view.querySelector('#search')?.value||'').toLowerCase(),filter=view.querySelector('#filter')?.value;return rows.filter(r=>r.join(' ').toLowerCase().includes(query)&&(!filter||filter==='Semua pengurus'||r[4]===(filter==='Pengurus IBI'?'Ya':'Tidak')))}
function updateRows(){const data=visibleRows();view.querySelector('#count').textContent=data.length;view.querySelector('#tbody').innerHTML=data.length?data.map(r=>`<tr><td>${r[0]}<br>${r[1]}<br><span class="muted">${r[2]}</span></td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td><button data-go="detail">Detail</button></td></tr>`).join(''):'<tr><td colspan="5">Belum ada peserta yang sesuai.</td></tr>'}
function download(data){const csv='\uFEFF'+[['ID acara','Nama acara','Nomor registrasi','Nama lengkap','Nomor HP','PC','Pengurus IBI','Bidan Delima'],...data.map(r=>[event,names[event],...r])].map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='contoh-peserta-'+event+'.csv';a.click();URL.revokeObjectURL(a.href)}
root.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;page=mode==='admin'?'events':'acara';render();return}if(b.dataset.page||b.dataset.go){page=b.dataset.page||b.dataset.go;if(['form','acara'].includes(page))mode='peserta';render();return}if(b.dataset.event){event=b.dataset.event;page='ringkasan';render();return}if(b.dataset.copy){names['copy'+Object.keys(names).length]=names[b.dataset.copy]+' — Salinan';render();return}if(b.dataset.up!==undefined||b.dataset.down!==undefined){const i=Number(b.dataset.up??b.dataset.down),j=i+(b.dataset.up!==undefined?-1:1);const groups=[[0,2],[3,3],[4,8],[9,10]];const g=groups.find(([a,z])=>i>=a&&i<=z);if(j>=g[0]&&j<=g[1]){[questions[i],questions[j]]=[questions[j],questions[i]];render()}return}
const a=b.dataset.action;if(visualAction(b,a))return;if(editorClick(b,a))return;if(a==='next'){if(step<2)step++;else page='konfirmasi';render()}if(a==='back'){if(step>0)step--;else page='acara';render()}if(a==='submit'){if(!view.querySelector('#agree').checked){view.querySelector('#feedback').textContent='Centang pernyataan sebelum mengirim.';return}const phone=String(answers.hp||'').replace(/\D/g,'').replace(/^62/,'0');if(Object.values(receipts).some(r=>r.event===event&&r.normalized===phone)){view.querySelector('#feedback').textContent='Nomor ini sudah terdaftar untuk acara ini.';return}receipts[event]={event,name:answers.nama,phone:answers.hp,normalized:phone,number:'REG-'+String(Date.now()).slice(-6),answers:{...answers}};another=false;persist();page='bukti';render()}if(a==='save'){saved=true;view.querySelector('#saved').textContent='Simulasi: bukti registrasi akan tersedia untuk disimpan.'}if(a==='csv')download(event==='pit'?rows:[]);if(a==='filteredcsv')download(visibleRows());if(a==='jabatan')view.querySelector('#extra').innerHTML=select('Tingkat kepengurusan tambahan',['PD','PC','Ranting'])+field('Jabatan tambahan');if(['correction','settingssave','ordersave','org','image','new'].includes(a)){const el=view.querySelector('#feedback');if(el)el.textContent=({correction:'Simulasi: koreksi dicatat beserta alasan dan waktu perubahan.',settingssave:'Simulasi: pengaturan acara disimpan.',ordersave:'Simulasi: urutan tersimpan. Pratinjau form masih menggunakan susunan awal.',org:'Simulasi: formulir pengelolaan / impor organisasi akan dibuka.',image:'Simulasi: pemilih gambar akan dibuka.',new:'Simulasi: acara baru dimulai dari pengaturan acara.'})[a];if(a==='image'){page='settings';render()}}};
render();
if(globalThis.Tweak){const appearance={accent:'#EB318D',corners:12};const apply=()=>{root.style.setProperty('--brand',appearance.accent);root.style.setProperty('--onbrand','#271020');root.querySelector('.shell').style.borderRadius=appearance.corners+'px'};const tweak=new Tweak({container:root,onChange:apply});tweak.addColorPicker(appearance,'accent',{label:'Warna utama',reference:'--brand'});tweak.addSlider(appearance,'corners',{label:'Sudut bingkai',min:0,max:24,unit:'px'});}
})();
</script>
